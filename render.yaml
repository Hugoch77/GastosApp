# Servicio de la API en Render (plan gratuito). Se crea desde el panel de Render con
# New → Blueprint, eligiendo este repositorio.
services:
  - type: web
    name: gastosapp-api
    runtime: python
    plan: free
    # Misma región que la base de datos de Neon (AWS us-east-2, Ohio).
    region: ohio
    rootDir: api
    buildCommand: pip install -r requirements.txt
    # Las migraciones corren al arrancar: así la base siempre está al día con el código.
    startCommand: python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Solo se publica si el CI de GitHub pasó.
    autoDeployTrigger: checksPass
    envVars:
      # Cadena de conexión de la rama `production` de Neon; Render la pide al crear el servicio.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://hugoch77.github.io
