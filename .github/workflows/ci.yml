name: CI

on:
  push:
  workflow_dispatch:

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  tools:
    name: Pruebas de herramientas (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: python -m pip install -r tools/requirements.txt
      - run: python -m pytest tools

  e2e:
    name: Pruebas E2E (Playwright + pytest)
    needs: checks
    runs-on: ubuntu-latest
    env:
      TZ: America/Mexico_City
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - run: npm ci
      - run: npm run build

      - name: Instalar dependencias de E2E
        run: |
          python -m pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Servir el build
        run: npx vite preview --port 4173 --strictPort &

      - name: Esperar a que el servidor responda
        run: curl --silent --retry 15 --retry-connrefused --retry-delay 1 --output /dev/null http://localhost:4173

      - name: Ejecutar pruebas E2E
        run: python -m pytest e2e --tracing retain-on-failure --output e2e/test-results

      - name: Guardar trazas de Playwright si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

  deploy:
    name: Publicar en GitHub Pages
    # Solo se publica lo que llega a master y pasó todas las pruebas.
    if: github.ref == 'refs/heads/master'
    needs: [checks, tools, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
